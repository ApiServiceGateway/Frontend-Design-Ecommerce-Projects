version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aura_dev_postgres
    restart: always
    environment:
      POSTGRES_USER: aura_dev
      POSTGRES_PASSWORD: aura_dev_password
      POSTGRES_DB: aura_marketplace_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura_dev -d aura_marketplace_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aura_dev_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
